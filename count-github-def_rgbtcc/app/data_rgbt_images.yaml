# ============================================================================
# DEF-rgbtcc RGB-T Crowd Counting - DJI Images Configuration
# ============================================================================
# Configuration for DEF-rgbtcc dual-modality (RGB + Thermal) crowd counting
# on DJI Drone Image pairs (DJI_0789_W.JPG / DJI_0790_T.JPG).
# ============================================================================

app:
  name: "def-rgbtcc-crowd-counting-dji-images"
  install_requirements: false
  requirements_file: "requirements.txt"
  seed: 42

environment:
  YOLO_CONFIG_DIR: ".yolo"
  MPLCONFIGDIR: ".cache/matplotlib"
  TORCH_HOME: ".cache/torch"

paths:
  video_rgb: "input/images/DJI_0789_W.JPG"
  video_thermal: "input/images/DJI_0790_T.JPG"
  weights: "weights/model.pth"
  weights_search_dirs:
    - "weights"
    - "."
  output_dir: "output/dji_images"
  annotated_video: "output/dji_images/dji_heatmap.mp4"
  frame_counts_csv: "output/dji_images/frame_counts.csv"
  summary_json: "output/dji_images/summary.json"
  snapshots_dir: "output/dji_images/snapshots"

runtime:
  require_cuda: false
  device: 0
  batch_size: 1
  auto_reduce_batch_on_oom: true
  empty_cuda_cache_every_batches: 0
  torch_float32_matmul_precision: "highest"
  allow_tf32: true

inference:
  task: "density_count"
  weight_format: "auto"
  imgsz: 640
  conf: 0.18
  iou: 0.65
  max_det: 2000
  classes:
    - 0
  augment: false
  half: false
  verbose: false
  vid_stride: 1
  rgb_mean: [0.485, 0.456, 0.406]
  rgb_std: [0.229, 0.224, 0.225]
  thermal_mean: [0.5, 0.5, 0.5]
  thermal_std: [0.5, 0.5, 0.5]

counting:
  count_source: "density_map"
  require_keypoints: false

output:
  output_resolution: [1280, 720]
  save_annotated_video: true
  save_frame_counts: true
  save_summary: true
  save_snapshot_every_n_frames: 1
  save_density_heatmap: true
  heatmap_colormap: "JET"
  heatmap_alpha: 0.5
  video_codec: "mp4v"
  progress_every_n_frames: 1
  overlay:
    enabled: true
    font_scale: 0.6
    thickness: 1

mlflow:
  enabled: false
  experiment_name: "rgbt-crowd-counting-dji-images"
  tracking_uri: "http://127.0.0.1:5000"
  run_name: "DEF-rgbtcc-DJI-Images"
  tags:
    environment: "production"
    scene: "dji_images"
    model: "DEF-rgbtcc"
    modalities: "RGB+Thermal"
  log_params: true
  log_step_metrics: true
  log_artifacts: true
  log_annotated_video: true
  log_model: false
  autolog_ultralytics: false
