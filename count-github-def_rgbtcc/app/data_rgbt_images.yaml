# ============================================================================
# DEF-rgbtcc RGB-T Crowd Counting - Medallion Data Architecture Configuration
# ============================================================================
# Medallion Layers (Bronze -> Silver -> Gold) configuration for DJI images:
# - Bronze Layer: Raw unaligned sensor imagery (data/bronze/images/DJI_0789_W.JPG)
# - Silver Layer: Homography aligned & equalized layers (data/silver/images/)
# - Gold Layer:   Heatmaps, telemetry CSV & executive JSON (data/gold/)
# ============================================================================

app:
  name: "def-rgbtcc-medallion-dji-images"
  install_requirements: false
  requirements_file: "requirements.txt"
  seed: 42

environment:
  YOLO_CONFIG_DIR: ".yolo"
  MPLCONFIGDIR: ".cache/matplotlib"
  TORCH_HOME: ".cache/torch"

paths:
  video_rgb: "data/bronze/images/DJI_0789_W.JPG"
  video_thermal: "data/bronze/images/DJI_0790_T.JPG"
  bronze_dir: "data/bronze"
  silver_dir: "data/silver"
  gold_dir: "data/gold"
  weights: "weights/model.pth"
  weights_search_dirs:
    - "weights"
    - "."
  output_dir: "data/gold"

preprocessing:
  enabled: true
  mode: "homography"
  target_resolution: [1280, 1024]
  thermal_clahe: true
  keep_aspect_ratio: true
  clahe_clip_limit: 2.5

runtime:
  require_cuda: false
  device: 0
  batch_size: 1
  auto_reduce_batch_on_oom: true
  empty_cuda_cache_every_batches: 0
  torch_float32_matmul_precision: "highest"
  allow_tf32: true

inference:
  task: "density_count"
  weight_format: "auto"
  imgsz: 640
  conf: 0.18
  iou: 0.65
  max_det: 2000
  classes:
    - 0
  augment: false
  half: false
  verbose: false
  vid_stride: 1
  rgb_mean: [0.485, 0.456, 0.406]
  rgb_std: [0.229, 0.224, 0.225]
  thermal_mean: [0.5, 0.5, 0.5]
  thermal_std: [0.5, 0.5, 0.5]

counting:
  count_source: "density_map"
  require_keypoints: false

output:
  output_resolution: [1280, 1024]
  save_annotated_video: true
  save_frame_counts: true
  save_summary: true
  save_snapshot_every_n_frames: 1
  save_density_heatmap: true
  heatmap_colormap: "JET"
  heatmap_alpha: 0.5
  video_codec: "mp4v"
  progress_every_n_frames: 1
  overlay:
    enabled: true
    font_scale: 0.6
    thickness: 1

mlflow:
  enabled: false
  experiment_name: "rgbt-crowd-counting-medallion"
  tracking_uri: "http://127.0.0.1:5000"
  run_name: "DEF-rgbtcc-Medallion-DJI"
  tags:
    environment: "production"
    architecture: "medallion"
    model: "DEF-rgbtcc"
    modalities: "RGB+Thermal"
  log_params: true
  log_step_metrics: true
  log_artifacts: true
  log_annotated_video: true
  log_model: false
  autolog_ultralytics: false
