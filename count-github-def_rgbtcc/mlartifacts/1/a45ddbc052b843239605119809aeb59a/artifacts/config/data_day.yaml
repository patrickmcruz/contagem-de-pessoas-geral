# ============================================================================
# YOLO Head Counting - Isolated Day Run Configuration
# ============================================================================
# Central configuration for the YOLO head counting application in day scenario.
# All paths are relative to this folder unless they are absolute paths.
# ============================================================================

# ============================================================================
# APPLICATION SETTINGS
# ============================================================================
app:
  name: "test-setup-11-heads-counting-enhanced-day" # Unique identifier for this configuration. Used for logging and file naming.
  install_requirements: false # If true, automatically installs Python packages from requirements_file. Set to true only if running in clean environment.
  requirements_file: "requirements.txt" # Path to pip requirements file. Used only if install_requirements: true.
  seed: 42 # Random seed for reproducibility of any random operations. Change this value to get different random initialization for different runs.

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
# These directories store YOLO configuration, PyTorch models, and Matplotlib cache.
# Set to local paths (like ".yolo") to keep cache in subfolder for portability.
# Set to absolute paths (like "/tmp/yolo") for shared system cache.
environment:
  YOLO_CONFIG_DIR: ".yolo" # YOLO configuration and cache directory. Stores model settings and downloaded weights.
  MPLCONFIGDIR: ".cache/matplotlib" # Matplotlib configuration cache (fonts, figure rendering settings, temporary files).
  TORCH_HOME: ".cache/torch" # PyTorch cache directory. Stores downloaded model weights and compiled extensions.

# ============================================================================
# FILE PATHS AND OUTPUTS
# ============================================================================
# Paths can be relative (relative to this YAML file location) or absolute.
# Relative paths recommended for portability across different machines.
paths:
  video: "input/videos/muralha-dia.mp4" # Input video file. MUST exist before running script. Relative or absolute path.
  images: "input/images/*" # Glob pattern for extracted frames (if applicable).
  weights: "weights/best.pt" # YOLO model weights filename or path. Common: best.pt (local PyTorch weights), best.engine (compiled TensorRT engine version).
  weights_search_dirs: # List of directories to search for model weights if not found in current folder. Order matters - searches first directory first.
    - "weights" # weights subfolder
    - "." # Current directory
  output_dir: "output/day" # Root directory where all outputs will be saved. Created automatically if doesn't exist.
  annotated_video: "output/day/muralha-dia_yolo26_head_count_crowdhuman.mp4" # Output video with detection boxes, person counts, and statistics overlaid. Only created if save_annotated_video: true.
  frame_counts_csv: "output/day/frame_counts.csv" # CSV file with per-frame person counts and frame-level timestamps. Useful for time-series analysis and graphing.
  summary_json: "output/day/summary.json" # JSON file with overall statistics (min/max/average person count, total frames, processing time, throughput, etc.).
  snapshots_dir: "output/day/snapshots" # Directory to save snapshot frames at regular intervals. Useful for quality control and debugging. Configure frequency with save_snapshot_every_n_frames.

# ============================================================================
# RUNTIME SETTINGS (GPU/CPU Configuration)
# ============================================================================
# These settings control how the script uses your hardware (GPU/CPU).
# Critical for performance and memory usage optimization.
runtime:
  require_cuda: true # If true, script fails immediately if CUDA/GPU unavailable. Set false for CPU-only (much slower). For RTX 4090: keep true.
  device: 0 # CUDA device ID. Use 0 for first GPU, 1 for second GPU, etc. Use nvidia-smi to check available devices.
  batch_size: 16 # Frames processed per GPU batch. RTX 4090: optimal at 16 or 32 for batch inference. Reduce if OutOfMemory errors.
  auto_reduce_batch_on_oom: true # If true, automatically halves batch size when GPU runs out of memory, retries processing. Keeps pipeline running instead of crashing. Recommended: true.
  empty_cuda_cache_every_batches: 0 # Clear GPU cache every N batches. Prevents memory fragmentation. Set 0 to disable.
  torch_float32_matmul_precision: "highest" # Matrix multiplication precision. Options: "highest" (best accuracy), "high" (balanced), "medium" (fastest).
  allow_tf32: true # Allow TensorFloat32 (faster but reduced precision) on compatible GPUs. RTX 4090: keep true.

# ============================================================================
# INFERENCE SETTINGS (YOLO Model Behavior)
# ============================================================================
# These settings control how the YOLO model processes frames.
# Affects speed, accuracy, and number of detections.
inference:
  task: "detect" # Model task type. Options: "detect" (bounding boxes only), "pose" (keypoints + boxes), "segment" (instance masks + boxes).
  imgsz: 1920 # Input image size (square). Larger = slower but more accurate. RTX 4090: 1920 (recommended for small head detections in high-res).
  conf: 0.18 # Confidence threshold for detections (0.0-1.0). Lower = more detections but more false positives. Dense crowds: 0.15-0.25.
  iou: 0.65 # IoU (Intersection over Union) threshold for NMS (Non-Maximum Suppression). Lower = fewer overlapping detections. Standard: 0.45-0.70.
  max_det: 2000 # Maximum detections per frame. Increase if your crowd exceeds this limit.
  classes: # List of COCO class IDs to detect. Use [0] for person only.
    - 0 # Class ID 0 = "person/head"
  augment: false # Use test-time augmentation (TTA) for improved accuracy. Slower (~1.3x). Set false if speed is critical.
  half: false # Use float16 (half precision) for faster inference with slight accuracy loss. RTX 4090: keep false for FP32 accuracy unless speed is priority.
  verbose: false # Print detailed YOLO logs. Set true for debugging model behavior, false for cleaner output.
  vid_stride: 1 # Process every Nth frame. Options: 1 (every frame, most accurate), 2 (every 2nd frame, 2x faster).

# ============================================================================
# COUNTING SETTINGS (Person Detection and Bounding Box Logic)
# ============================================================================
# These settings determine HOW people are counted.
counting:
  count_source: "boxes" # Method for counting people. Options: "boxes" (count bounding boxes), "keypoints" (count keypoint clusters).
  require_keypoints: false # Require keypoints to count a person. Set false for standard bounding-box based crowd counting.

# ============================================================================
# OUTPUT SETTINGS (Video and File Generation)
# ============================================================================
# These settings control what files are generated and their properties.
# Generate only what you need to save processing time and disk space.
output:
  output_resolution: [1280, 720] # Output resolution [width, height] to resize annotated video and snapshots. Lower resolution saves disk space.
  save_annotated_video: true # Save video with detection boxes and counts overlaid. Set false to skip video generation (saves disk I/O time).
  save_frame_counts: true # Save per-frame counts to CSV. Always recommended for analysis, graphing, debugging.
  save_summary: true # Save aggregate statistics (min/max/average counts, FPS, processing time) to JSON.
  save_snapshot_every_n_frames: 30 # Save frame snapshot every N frames. Set 0 to disable.
  video_codec: "mp4v" # Codec for output video. Options: "mp4v" (H.264, broad compatibility).
  progress_every_n_frames: 300 # Print progress update every N frames. Set 0 to disable.
  overlay: # Visual overlay settings for annotated video output
    enabled: true # Enable bounding boxes and count text overlay on video. Set false if you only need CSV/JSON data.
    font_scale: 0.6 # Font size for text overlay.
    thickness: 1 # Line thickness for boxes and text (1-5 pixels).

# ============================================================================
# MLFLOW EXPERIMENT TRACKING SETTINGS
# ============================================================================
# MLflow tracks runs, hyperparameters, step-level metrics, and output artifacts.
mlflow:
  enabled: true # Enables MLflow experiment tracking.
  experiment_name: "head-counting-pipeline" # MLflow experiment grouping name.
  tracking_uri: "http://127.0.0.1:5000" # MLflow tracking server URI or local directory path.
  run_name: "YOLO26x-Day-Muralha" # Descriptive run identifier.
  tags:
    environment: "production"
    scene: "day"
    model: "yolo26x"
  log_params: true # Logs pipeline configuration parameters.
  log_step_metrics: true # Logs real-time crowd count per frame index.
  log_artifacts: true # Logs CSV, JSON summary, and config YAML artifacts.
  log_annotated_video: true # Uploads annotated video to MLflow artifacts.
  log_model: false # Uploads YOLO model weights to MLflow artifacts.
  autolog_ultralytics: false # Toggles Ultralytics autologging callbacks.

